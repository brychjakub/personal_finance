name: Update Spendee data in Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  update-spendee-google-sheets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update Google Sheet
        env:
          SPENDEE_TOKEN: ${{ secrets.SPENDEE_TOKEN }}
          SPENDEE_TOKEN_URL: ${{ secrets.SPENDEE_TOKEN_URL }}
          SPENDEE_REFRESH_TOKEN: ${{ secrets.SPENDEE_REFRESH_TOKEN }}
          SPENDEE_CLIENT_ID: ${{ secrets.SPENDEE_CLIENT_ID }}
          SPENDEE_CLIENT_SECRET: ${{ secrets.SPENDEE_CLIENT_SECRET }}
          SPENDEE_TOKEN_AUTH_MODE: ${{ secrets.SPENDEE_TOKEN_AUTH_MODE }}
          SPENDEE_DEVICE_UUID: ${{ secrets.SPENDEE_DEVICE_UUID }}
          SPENDEE_WALLET_MAPPINGS: ${{ secrets.SPENDEE_WALLET_MAPPINGS }}
          SPENDEE_WALLET_ID: ${{ secrets.SPENDEE_WALLET_ID }}
          SPENDEE_INTERNAL_ID: ${{ secrets.SPENDEE_INTERNAL_ID }}
          SPENDEE_WALLET_NOTE: ${{ secrets.SPENDEE_WALLET_NOTE }}
          GOOGLE_SHEET_RECORDS_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_RECORDS_SHEET_NAME }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/update_spendee_google_sheets.py
